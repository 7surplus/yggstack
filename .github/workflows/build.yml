name: build
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches:
      - codex/yggdrasil-vpn-lifecycle
      - main
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Submodule over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 -- lib/yggstack
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: Android SDK
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses >/dev/null || true
          $SDKM "platforms;android-37.0" "ndk;28.2.13676358" "build-tools;35.0.0"
          ln -s $ANDROID_HOME/platforms/android-37.0 $ANDROID_HOME/platforms/android-37
      - name: Hev AAR
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/hev-socks5-tunnel.aar https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel.aar
      - name: Go AAR (release)
        env:
          CI: "true"
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          export NDK_HOME=$ANDROID_NDK_HOME
          export PATH=$(go env GOPATH)/bin:$PATH
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          cd lib/yggstack && bash mobile/build-android.sh
          cp android-build/yggstack.aar ../../app/libs/yggstack.aar
      - name: Gradle release
        run: ./gradlew --no-daemon assembleGoRelease
      - name: Sign
        run: |
          set -euo pipefail
          BT=$ANDROID_HOME/build-tools/35.0.0
          DIR=app/build/outputs/apk/go/release
          mapfile -t APKS < <(find "$DIR" -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one arm64 APK, found ${#APKS[@]}:"
            ls -lh "$DIR"
            exit 1
          fi
          APK=${APKS[0]}
          test -s "$APK"
          echo "Signing $APK"
          keytool -genkeypair -keystore ygg.jks -alias ygg -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass yggpass -keypass yggpass -dname "CN=ygg"
          $BT/zipalign -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks ygg.jks --ks-pass pass:yggpass --out yggstack-plus-release.apk aligned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: yggstack-plus-arm64-release
          path: yggstack-plus-release.apk
      - name: Publish one arm64 APK release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Yggstack Plus ${{ github.ref_name }}
          files: yggstack-plus-release.apk
          body: "Single arm64-v8a APK built by CI."
